[package]
name = "instagram-chat-history-viewer"
version = "0.1.0"
description = "A lightweight Windows desktop Instagram Chat History Viewer"
authors = ["Senior Product Architect & Engineering Planning Agent"]
edition = "2021"

[lib]
name = "instagram_chat_history_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
